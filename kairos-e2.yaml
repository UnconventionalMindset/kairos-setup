#cloud-config
install:
  image: "docker:quay.io/unconventionalmindset/kairos-fedora-transcoding:2.0.1-kairos-3.5.2-k3s-1.33.4"
  device: "/dev/vda"
  auto: true
  reboot: true

debug: true

hostname: kairos-fed-k3s-e2
users:
- name: kairos
  groups:
    - "admin"
  ssh_authorized_keys:
    - "github:UnconventionalMindset"
    - "ssh-rsa  nousername"

k3s:
  enabled: true
  args:
  - --disable=traefik,servicelb
  - --node-ip 192.168.31.192
  - --server https://192.168.31.193:6443
  - --cni-bin-dir=/var/lib/rancher/k3s/data/current/bin
  # Token will be generated if not specified at /var/lib/rancher/k3s/server/node-token
  env:
    K3S_NODE_NAME: "e2"
    K3S_TOKEN: ""

stages:
    boot:
      - systemctl:
          disable:
            - firewalld
    initramfs:
        - files:
            - content: |
                [connection]
                id=wired-fixed-ip
                type=802-3-ethernet
                autoconnect=true
                interface-name=ens18
                autoconnect-priority=10

                [ethernet]

                [ipv4]
                method=manual
                addresses=192.168.31.192/24
                gateway=192.168.31.1
                dns=1.1.1.1;8.8.8.8
                dns-search=
              path: /etc/NetworkManager/system-connections/static-ethernet.nmconnection
              permissions: 0600
              owner: 0
              group: 0

