#cloud-config
# Kairos install config for node hs. See README.adoc.
# The k3s token is generated on first boot. After install read it with:
#   sudo cat /var/lib/rancher/k3s/server/node-token
# and paste it into kairos-e2.yaml and kairos-e1.yaml before installing those.

debug: true
hostname: kairos-fed-k3s-hs

install:
  auto: true
  device: /dev/vda
  reboot: true
  poweroff: false
  # Sizes in MiB. state holds active + passive + one temporary image during an upgrade;
  # recovery holds the recovery image twice for an in-place recovery upgrade; persistent takes the rest.
  partitions:
    oem:
      size: 64
    state:
      size: 32768
    recovery:
      size: 9216
    persistent:
      size: 0        # 0 = take all remaining space
  system:
    size: 5120
  passive:
    size: 5120
  recovery-system:
    size: 4096
  # Pinned to the published tag so installing from the wrong ISO can never pull the old
  # ...:latest image (that tag still points at Kairos 3.5.3 / Fedora 40).
  source: "docker:quay.io/unconventionalmindset/kairos-fedora-transcoding:4.4.4-fedora43-k3s-1.35.10"

users:
  - name: kairos
    groups:
      - admin
    ssh_authorized_keys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILB9VK4DY3oaRiObc6pbyXAsJ/fE4qFDDrSWxnw8tSSi 11658632+UnconventionalMindset@users.noreply.github.com"

k3s:
  enabled: true
  args:
    - --disable=traefik,servicelb
    - --node-ip 192.168.31.193
    - --cluster-init
  env:
    K3S_NODE_NAME: "hs"

stages:
  boot:
    - systemctl:
        disable:
          - firewalld
        enable:
          - iscsid
  initramfs:
    - files:
        - path: /etc/systemd/network/01-man.network
          permissions: 0644
          owner: 0
          group: 0
          content: |
            [Match]
            Name=en*

            [Network]
            Address=192.168.31.193/24
            Gateway=192.168.31.1
            DNS=1.1.1.1
            DNS=8.8.8.8
        - path: /etc/systemd/journald.conf.d/00-kairos.conf
          permissions: 0644
          content: |
            [Journal]
            SystemMaxUse=500M
